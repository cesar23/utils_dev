matches:
  - trigger: ":md_menu"
    replace: |
      Actúa como editor experto de documentación en Markdown. Reformatea mi documento con estas reglas:

      1. Antes de cada título declara un ancla propia: <a id="slug"></a>
      2. El slug es solo ASCII: minúsculas, números y guiones. Sin tildes, sin ñ, sin emojis, sin símbolos ni espacios. Debe ser único.
      3. Los iconos van solo en el texto visible, nunca en el id ni en el href.
      4. Crea al inicio el índice así:
         <a id="indice"></a>
         ## 📌 Índice
         - [📦 2. Cortar línea](#cortar-linea)
      5. Al final de cada sección agrega: [⬆️ Volver al índice](#indice)
      6. Cada sección: ancla, título ## con icono, contenido, enlace de regreso, separador ---
      7. No cambies comandos ni bloques de código. Si ves errores técnicos, avísame.
      8. Al final entrega una tabla de verificación: texto del índice | href | id declarado | ¿coincide?
      9. Entrega todo en un único bloque de código con cuatro backticks.

      Mi documento actual